# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - ppro

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: containerppro.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C8144D4A5FE2412C93AF2938A429A425 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_770F532D374F4004BBA9B7B0EB0A704A }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: containerppro.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C8144D4A5FE2412C93AF2938A429A425 }}/containerppro/ppro:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7953F0D2E5374CFFB6CC266B56B04749 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7AE3753986FC4CD4976DDC5C41DD1667 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3541B560D1404351909A2CC4DEB30D95 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ppro'
          slot-name: 'Production'
          images: 'containerppro.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C8144D4A5FE2412C93AF2938A429A425 }}/containerppro/ppro:${{ github.sha }}'
          